name = "nicemusic-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# Créer le namespace KV (une seule fois) :
#   wrangler kv namespace create NICEMUSIC_KV
# puis coller l'id ci-dessous. En dev local (wrangler dev), n'importe quelle
# valeur fonctionne : la donnée est stockée en local dans .wrangler/.
[[kv_namespaces]]
binding = "NICEMUSIC_KV"
id = "REMPLACEZ_PAR_L_ID_DU_NAMESPACE_KV"
